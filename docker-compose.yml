services:
  backend:
    build: ./backend
    # The backend will listen on 8000 internally (HTTP only)
    expose:
      - "8000"
    volumes:
      - ./backend/media:/app/media
    environment:
      - AES_SECRET_KEY=0123456789abcdef0123456789abcdef
      - AES_IV=abcdef9876543210
    command: >
      sh -c "python manage.py makemigrations && python manage.py migrate &&
            gunicorn secure_file_share.wsgi:application --bind 0.0.0.0:8000"

  nginx:
    image: nginx:latest
    ports:
      # Map host port 8000 to container port 443 (HTTPS)
      - "8000:443"
    volumes:
      # Mount the nginx.conf file as the default configuration
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount the certificate directory (assumes your backend certs are here)
      - ./backend/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment: 
      - NEXT_PUBLIC_BACKEND_URL=https://localhost:8000